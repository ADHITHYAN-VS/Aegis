name: Aegis CI Workflow

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify Branchless Verifier (Zero Branch Keywords in Hot Path)
        run: |
          ! grep -E "\b(if|switch)\b|\?|===" packages/runtime/src/verifier.ts

      - name: Run typecheck
        run: pnpm typecheck

      - name: Build all packages
        run: pnpm build

      - name: Run unit & integration test suite
        run: pnpm test
